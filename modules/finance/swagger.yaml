  responses:
    SuccessEmpty:
      description: Successful operation with no data returned
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                properties:
                  data:
                    nullable: true
                    example: null
          example:
            success: true
            statusCode: 200
            message: 'Operation completed successfully'
            data: null
            timestamp: '2024-01-15T10:30:00.000Z'
            requestId: 'req_01JABCDE'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            statusCode: 404
            error:
              code: 'NOT_FOUND'
              message: 'Resource not found'
            timestamp: '2024-01-15T10:30:00.000Z'
            requestId: 'req_01JABCDE'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            statusCode: 400
            error:
              code: 'VALIDATION_ERROR'
              message: 'Request validation failed'
              details:
                - field: 'code'
                  message: 'Invalid account code format'
                - field: 'name'
                  message: 'Name is required'
            timestamp: '2024-01-15T10:30:00.000Z'
            requestId: 'req_01JABCDE'

    Conflict:
      description: Conflict error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            statusCode: 409
            error:
              code: 'ACCOUNT_CODE_EXISTS'
              message: 'Account code already exists'
            timestamp: '2024-01-15T10:30:00.000Z'
            requestId: 'req_01JABCDE'
