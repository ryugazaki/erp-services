    # Request DTOs
    CreateAccountRequest:
      type: object
      required:
        - code
        - name
        - type
      properties:
        code:
          type: string
          pattern: '^[0-9]+(-[0-9]+)+$'
          description: Hierarchical code (e.g., "1-1001")
          example: '1-1001'
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: 'Cash'
        description:
          type: string
          maxLength: 500
          example: 'Primary cash account'
        type:
          type: string
          enum: [ASSET, LIABILITY, EQUITY, REVENUE, EXPENSE]
          example: 'ASSET'
        parentId:
          type: string
          format: uuid
          description: Parent account ID for hierarchical accounts

